[package]
name = "buttlick"
version = "0.1.0"
edition = "2021"
description = "Grammar-Homomorphic Zero-Decompression Storage and Compute Engine"
license = "MIT"
authors = ["Buttlick Contributors"]

[lib]
name = "buttlick"
path = "src/lib.rs"

[[bin]]
name = "buttlick"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
rustc-hash = "2.0"
regex-automata = { version = "0.4", features = ["dfa", "syntax", "perf"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"

[dev-dependencies]
proptest = "1.5"
rand = "0.8"
tempfile = "3.10"
